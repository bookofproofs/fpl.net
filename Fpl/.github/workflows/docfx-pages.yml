name: Build and deploy API docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build Fpl (Release)
        run: dotnet build Fpl/Fpl/Fpl.fsproj --configuration Release --no-restore

      - name: Install DocFX (Linux)
        run: |
          DOCFX_VER="v2.61.0"
          wget "https://github.com/dotnet/docfx/releases/download/${DOCFX_VER}/docfx-linux-x64.zip" -O docfx.zip
          unzip docfx.zip -d docfx
          chmod +x docfx/docfx
          ./docfx/docfx --version

      - name: Generate DocFX site
        working-directory: Fpl
        run: |
          ../docfx/docfx metadata docfx.json
          ../docfx/docfx build docfx.json -o _site/api

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Fpl/_site

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
