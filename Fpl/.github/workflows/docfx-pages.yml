name: Build API docs artifact

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-docfx:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build Fpl (Release)
        run: dotnet build Fpl/Fpl/Fpl.fsproj --configuration Release --no-restore

      - name: Verify built assembly
        shell: bash
        run: |
          DLL_PATH="Fpl/Fpl/bin/Release/net8.0/Fpl.dll"
          if [ ! -f "$DLL_PATH" ]; then
            echo "ERROR: $DLL_PATH not found"
            echo "Listing Fpl/Fpl/bin/Release/net8.0:"
            ls -la Fpl/Fpl/bin/Release/net8.0 || true
            exit 1
          fi
          echo "Found: $DLL_PATH"

      - name: Install DocFX
        run: |
          DOCFX_VER="v2.61.0"
          wget "https://github.com/dotnet/docfx/releases/download/${DOCFX_VER}/docfx-linux-x64.zip" -O docfx.zip
          unzip docfx.zip -d docfx
          chmod +x docfx/docfx
          ./docfx/docfx --version

      - name: Generate DocFX site
        working-directory: Fpl
        run: |
          ../docfx/docfx metadata docfx.json
          ../docfx/docfx build docfx.json -o _site/docs

      - name: Upload DocFX artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: Fpl/_site
          if-no-files-found: error
