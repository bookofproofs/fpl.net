name: Build and deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download DocFX artifact
        uses: actions/download-artifact@v4
        with:
          name: api-docs
          path: _site/docs

      - name: Prepare Pages root
        run: |
          mkdir -p _site
          cp README.md _site/index.md

      - name: Build root homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          md = Path('_site/index.md').read_text(encoding='utf-8')
          title = 'FPL'
          m = re.search(r'^#\s+(.+)$', md, re.M)
          if m:
              title = m.group(1).strip()
          html = f'''<!doctype html>
          <html>
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>{title}</title>
          </head>
          <body>
            <main>
              <h1>{title}</h1>
              <p><a href="docs/index.html">API documentation</a></p>
            </main>
          </body>
          </html>
          '''
          Path('_site/index.html').write_text(html, encoding='utf-8')
          PY

      - name: Verify site structure
        run: |
          test -f _site/index.html
          test -f _site/docs/index.html
          find _site -maxdepth 2 -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
